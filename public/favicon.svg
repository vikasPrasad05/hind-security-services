<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#000411"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
  </defs>
  <!-- Rounded Card Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <!-- Wider Bold Shield Emblem -->
  <path d="M 50 10 L 88 22 V 52 C 88 74 50 90 50 90 C 50 90 12 74 12 52 V 22 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round"/>
